# 城市中文名：会议页的地点块、会议列表和投稿路线用它。格式见 schema/cities.schema.json 和 DATA_GUIDE §10。
#
# - name：数据里的英文写法（curated 届次的 location.city、sites[].city，或 ccfddl place 按逗号拆开后的一段）。
#   aliases：别的写法（不带重音、本地名、旧称）。比较时不分大小写，不看重音、句点和逗号。
# - name_zh：通行的中文译名。country_code：ISO 3166-1 两位字母，中文名在下面的 countries 里。
# - tz：城市的 IANA 时区，用来算会期那几天当地比北京快或慢几小时。ccfddl 的届次只有截止日期的时区（多是 AoE），
#   没有会场时区，所以时差按这里的 tz 算；curated 届次的会期时区必须和这里一致（pnpm validate 检查）。
# - 同名城市按国家区分：数据写了国家时，只认国家对得上的那一个（写 China 的港澳台地名也算对得上）。
# - region: true：这个名字也是州名（Washington、New York），只在 place 的第一段才当城市。
# - state：美国同名城市多，place 里城市后面跟着州名时，州名要在这个列表里（"Columbia, SC"）。
# - 新届次的城市不在这里时，pnpm validate 报错：加一行；实在不是城市（只有地区名）的，写进最后的 unknown。

