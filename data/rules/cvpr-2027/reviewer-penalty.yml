id: cvpr-2027/reviewer-penalty
edition: cvpr-2027
family: reciprocal_reviewing
question_zh: 作为审稿人迟交审稿或审稿“极不负责”，自己的论文会被 desk reject 吗？
answer: conditional
verification: inherited
inherited_from: cvpr-2026
conf: medium
applies:
  from: paper
  until: notification
  note_zh: 审稿期内生效；2027 审稿时间表尚未公布
summary_zh: 2027 审稿指南尚未公布，以下为 2026 规则：审稿人迟交审稿，或审稿被认定为“极不负责”（包括用 LLM 写审稿），PC 可酌情 desk reject 其署名的全部论文。迟交审稿人的共同作者也会收到“论文可能被 desk reject”的通知。
detail_zh: 2026 所列的“极不负责”包括：过短且不涉及论文具体技术内容、只有套话、对方法或结果有明显事实错误，以及由 LLM 生成或大量借助 LLM 写成的审稿。被标记为可能违反 LLM 政策的审稿会进入同一套审查流程，确认违规后由 PC 酌情 desk reject 该审稿人投的论文。
quotes:
  - src: cvpr-2026-reviewer-guidelines
    text: "Any reviewer whose review is deemed to be “highly irresponsible” will face a desk rejection of all papers on which they are an author at the discretion of the PCs. In addition, any reviewer who fails to submit their assigned reviews by the deadline is subject to desk rejection of all papers on which they are an author."
  - src: cvpr-2026-reviewer-guidelines
    text: "Additionally, the co-authors of reviewers who have not submitted their reviews will also be notified that their submission may be desk rejected if all authors do not submit their reviews in time."
  - src: cvpr-2026-reviewer-guidelines
    text: "Highly irresponsible reviewing includes: unreasonably short reviews that fail to reference specific technical content from the paper; reviews containing only generic comments that could apply to any submission without addressing the paper's actual contribution; reviews with demonstrable factual errors about the paper's methodology or results that indicate superficial reading; and reviews generated by or substantially assisted by Large Language Models."
  - src: cvpr-2026-reviewer-guidelines
    text: "If a review is flagged as a possible violation, the review will enter the oversight process for irresponsible review violations. If it is determined that the review violates this policy, the papers submitted by the reviewer will be desk rejected at the discretion of the PCs."
effect:
  kind: requires
  target: timely_responsible_reviews
last_checked: 2026-09-24
