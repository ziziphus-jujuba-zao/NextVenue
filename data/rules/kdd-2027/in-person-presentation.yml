id: kdd-2027/in-person-presentation
edition: kdd-2027
family: presentation
question_zh: 论文录用后必须有作者到现场报告吗？
short_zh: 到现场报告
answer: required
verification: human
conf: high
applies:
  from: notification
  until: conference
summary_zh: 必须。KDD 2027 只在圣何塞现场举办，不能线上报告；每篇录用论文至少要有一位作者注册并到现场报告。缺席的论文可能被移出日程和论文集。
detail_zh: 每篇论文还要单独有一份按非学生线下价的全会注册，不管到不到场都要（见清单里的作者注册一步）。两轮录用的论文都在 2027 年 8 月的会上报告。
quotes:
  - src: kdd-2027-faq
    text: "KDD 2027 is planned to be a fully in-person conference. There will be no virtual component to the conference, and papers cannot be presented virtually."
  - src: kdd-2027-faq
    text: "At least one author of each accepted paper must register for KDD and present the work in person."
  - src: kdd-2027-research-cfp
    text: "No-show papers may be withdrawn from the conference program and proceedings where it applies."
effect:
  kind: requires
  target: in_person_presentation
last_checked: 2026-09-25
