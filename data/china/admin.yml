  # ---------- 报销 ----------
  - id: sysu-fx-rate
    org_zh: 中山大学 · 财务与国资管理处
    who: all
    topic: reimburse
    text_zh: 外币费用按银行结算单或购汇单上的汇率折算；没有的，按支付当日中国银行现汇卖出价折算。刷卡和购汇凭证要留好。
    src: china-admin-sysu-fx
    quote: "银行结算单或购汇单上能显示外币汇率的，则按此汇率换算；未能确定实际外币汇率的，则按实际支付/汇款当日中国银行外汇牌价的现汇卖出价换算。"
  - id: sysu-fx-per-diem
    org_zh: 中山大学 · 财务与国资管理处
    who: all
    topic: reimburse
    text_zh: 伙食费、公杂费等包干补助，按回国入境当天中国银行现汇卖出价折算。
    src: china-admin-sysu-fx
    quote: "按照回国抵境当日中国银行外汇牌价的现汇卖出价换算报销金额"
  # ---------- 国家规定（财行〔2013〕516号） ----------
  - id: fin-2013-516-foreign-airline
    org_zh: 财政部 外交部（财行〔2013〕516号）
    who: all
    topic: reimburse
    text_zh: 确需乘坐外国航空公司航线的，要事先报单位外事和财务部门批准。
    src: china-admin-fin-2013-516
    quote: "由于航班衔接等原因确需选择外国航空公司航线的，应当事先报经单位外事和财务部门审批同意"
  - id: fin-2013-516-conference-hotel
    org_zh: 财政部 外交部（财行〔2013〕516号）
    who: all
    topic: reimburse
    text_zh: 会议指定或推荐的酒店超出住宿标准的，要事先报批。
    src: china-admin-fin-2013-516
    quote: "超出费用标准的，须事先报经本单位外事和财务部门批准"
  - id: fin-2013-516-per-diem-days
    org_zh: 财政部 外交部（财行〔2013〕516号）
    who: all
    topic: reimburse
    text_zh: 伙食费和公杂费的天数，按离开和回到中国国境的日期算。
    src: china-admin-fin-2013-516
    quote: "包干天数按离、抵我国国境之日计算"
  - id: fin-2013-516-registration-receipt
    org_zh: 财政部 外交部（财行〔2013〕516号）
    who: all
    topic: reimburse
    text_zh: 签证费、会议注册费凭原始票据报销。
    src: china-admin-fin-2013-516
    quote: "出国签证费用、防疫费用、国际会议注册费用等凭有效原始票据据实报销"
  - id: fin-2013-516-audit-documents
    org_zh: 财政部 外交部（财行〔2013〕516号）
    who: all
    topic: reimburse
    text_zh: 报销时财务要核对任务批件、护照（含签证和出入境记录）复印件和费用明细票据，按批准的人员、天数、路线核销。
    src: china-admin-fin-2013-516
    quote: "出国任务批件、护照（包括签证和出入境记录）复印件及有效费用明细票据进行认真审核，严格按照批准的出国团组人员、天数、路线、经费预算及开支标准核销经费"
