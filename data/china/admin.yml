# 校内出国（境）手续：各校和国家规定的例子，每条带官网原文。
# 用途：录用后清单"学校审批"一步的"常见要求"，以及"出行设置"里审批天数的说明文字。
# 这些只是例子，不是默认值，也不是学校模板：各校、各院系、学生和教职工都不一样，界面必须写"以本校最新通知为准"。
# 只收学校和政府官网；学生自编指南（例如清华 PACMAN）不收。
last_checked: 2026-09-25
note_zh: 各校规定不同，而且随时修订。以本校国际合作处、研究生院、财务处的最新通知为准。
items:
