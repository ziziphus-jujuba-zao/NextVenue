    quote: "The new submission deadline is September 16, 2026, at 23:59 PST."
    note_zh: 原定 9/15，9/16 官网公告延期 24 小时；RAS 页面仍写 15 September 2026。官方写“PST”，但 9 月在夏令时内，按 America/Los_Angeles（PDT）记，即北京时间 9/17 14:59。ICRA 没有单独的摘要截止。
