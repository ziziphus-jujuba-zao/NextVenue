  - type: supplementary
    at: 2026-07-31T23:59
    tz: AoE
    status: confirmed
    src: aaai-27-cfp
    quote: "July 31, 2026 Supplementary material and code due by 11:59 PM UTC-12"
  - type: phase1_notification
    at: 2026-09-24
    tz: AoE
    status: confirmed
    src: aaai-27-cfp
    quote: "September 24, 2026 Notification of Phase 1 rejections"
    note_zh: 官方只给日期、未给时刻；时间表注明所有截止按 AoE（UTC-12）计。Phase 1 被拒的论文此时即可看到审稿意见（含 AI 生成的审稿）。
  - type: author_response
    label_zh: Author feedback（仅 Phase 2 论文）
    start: 2026-10-19
    end: 2026-10-25
    tz: AoE
    status: confirmed
    src: aaai-27-cfp
    quote: "October 19-25, 2026 Author feedback window"
    note_zh: 主技术 track 的窗口（AISI 特殊 track 的时间表写的是同一窗口）；官方只给日期、未给开关时刻。AI Alignment 特殊 track 另有日程（其征稿页写 10/27–11/2）。
  - type: discussion
    tz: AoE
    status: tba
    note_zh: 审稿流程页只说 PC 与 SPC 会结合 author feedback 进行讨论，未给日期。
  - type: notification
    at: 2026-11-30
    tz: AoE
    status: confirmed
    src: aaai-27-cfp
    quote: "November 30, 2026 Notification of final acceptance or rejection"
    note_zh: 主技术 track；审稿流程页也写 11/30 公布最终结果。官方未给时刻。
  - type: camera_ready
    at: 2026-12-14T23:59
    tz: AoE
    status: confirmed
    src: aaai-27-cfp
    quote: "December 14, 2026 Submission of camera-ready files"
    note_zh: 主技术 track；官方只给日期，按时间表“所有截止均为 AoE”的说明记为当天 23:59 AoE。
  - type: author_registration
    tz: AoE
    status: tba
    note_zh: 官方要求至少一位作者按线下价注册并现场报告，否则论文不进论文集，但作者页面和注册页都没有写作者注册截止日期。
  - type: financial_aid
    label_zh: 学生志愿者（Student Scholar Volunteer）申请
    start: 2026-11-30T00:01
    end: 2026-12-04T23:59
    tz: America/Toronto
    status: confirmed
    src: aaai-27-ssv
    quote: "Application Closes: December 4, 2026 – Closes at 11:59PM Eastern Time"
    note_zh: '开放时间原文是 "Application Opens: November 30, 2026 – Opens at 12:01AM Eastern Time"，即北京时间 11/30 周一 13:01；截止是北京时间 12/5 周六 12:59。申请者须是 AAAI 会员；结果出来前不要注册（见"志愿者结果前注册"卡）。'
  - type: financial_aid_result
    label_zh: 学生志愿者结果
    tz: America/Toronto
    status: tba
    note_zh: 官方没有公布志愿者结果的日期。
  - type: early_registration
    at: 2026-12-15T23:59
    tz: America/Toronto
    status: confirmed
    src: aaai-27-registration
    quote: "All deadlines are 11:59 PM EST Early On or before December 15, 2026"
    note_zh: 北京时间 12/16 周三 12:59，也就是出结果后约两周。线上票同一天从早鸟价转为标准价。
  - type: standard_registration
    at: 2027-01-10T23:59
    tz: America/Toronto
    status: confirmed
    src: aaai-27-registration
    quote: "Standard By January 10, 2027 Late After January 10, 2027"
    note_zh: 北京时间 1/11 周一 12:59，之后是 late 价。
  - type: refund_cutoff
    label_zh: 退款申请截止（每笔扣 $100 手续费）
    at: 2027-01-10T23:59
    tz: America/Toronto
    status: confirmed
    src: aaai-27-registration
    quote: "The deadline for refund requests is January 10, 2027 at 11:59 PM EST."
    note_zh: 北京时间 1/11 周一 12:59。要发邮件到 aaaireg@aaai.org 书面申请；每笔退款扣 $100 手续费（"A $100.00 processing fee will be assessed for all refunds."），所以不是全额。官方没有拒签退款的专门条款。
  - type: poster
    tz: America/Toronto
    status: tba
    note_zh: 注册页只写了 poster 场次（2/17–2/20 中午，Palais des congrès 2 层 220 厅），没有 poster 尺寸和提交截止。
  - type: conference
    start: 2027-02-16
    end: 2027-02-23
    tz: America/Toronto
    status: confirmed
    src: aaai-27-cfp
    quote: "February 16-23, 2027 AAAI-27 Conference"
logistics:
  venue:
    name: Palais des congrès de Montréal
    address: tba
    src: aaai-27-accommodation
    quote: "We are excited to welcome you to AAAI-27 at the Palais des congrès de Montréal!"
  fees:
    - currency: USD
      src: aaai-27-registration
      quote: "All deadlines are 11:59 PM EST Early On or before December 15, 2026 Standard By January 10, 2027 Late After January 10, 2027"
      note_zh: 技术会议注册（含论文和 poster 场次、邀请报告、开幕招待会）。价格只有会员价：已是会员的选前两行；不是会员的选 Silver，含一年线上会员。workshop、tutorial 另外收费。
      tiers:
        - { id: early, until: early_registration }
        - { id: standard, until: standard_registration }
        - { id: late }
      rows:
        - id: member
          label_zh: 在册会员
          for: [academic, industry]
          member: current
          covers_author: true
          amounts: [750, 995, 1250]
          quote: "AAAI Member Technical $750 $995 $1250"
        - id: student_member
          label_zh: 在册学生会员
          for: [student]
          member: current
          covers_author: true
          amounts: [350, 475, 600]
          quote: "AAAI Student Technical $350 $475 $600"
        - id: silver
          label_zh: 新入会或续会（含一年会员）
          for: [academic, industry]
          member: new
          covers_author: true
          amounts: [870, 1120, 1370]
          quote: "AAAI Silver Technical $870 $1120 $1370"
        - id: student_silver
          label_zh: 学生新入会或续会（含一年会员）
          for: [student]
          member: new
          covers_author: true
          amounts: [390, 515, 640]
          quote: "AAAI Student Silver Technical $390 $515 $640"
    - currency: USD
      src: aaai-27-registration
      quote: "This rate is not for presenting authors."
      note_zh: 线上票只有两档（"Standard After December 15, 2026"），不能用来满足作者注册要求。
      tiers:
        - { id: early, until: early_registration }
        - { id: standard }
      rows:
        - id: virtual
          label_zh: 线上
          for: [academic, industry]
          member: none
          covers_author: false
          amounts: [80, 120]
          quote: "Virtual Regular $80 $120"
        - id: virtual_student
          label_zh: 线上学生
          for: [student]
          member: none
          covers_author: false
          amounts: [40, 60]
          quote: "Virtual Student $40 $60"
  coverage:
    per: unspecified
    rate: in_person
    extra_zh: 官方只写每篇论文至少一位作者按线下价注册并现场报告，没写一份注册能覆盖几篇。有多篇论文的，建议直接问主办方。
    src: aaai-27-registration
    quote: "At least one author is required to register for the conference at the in-person rate and to present the paper in-person"
  visa_letter:
    after: paid_registration
    how_zh: 付费注册后，用注册确认邮件里的链接申请邀请函；递交加拿大签证后，要把签证申请号（VAN）等信息报给 AAAI，怎么报写在邀请函邮件里。
    lead: tba
    url: https://aaai.org/conference/aaai/aaai-27/visa-letters-of-invitation/
    src: aaai-27-visa-letters
    quote: "AAAI will provide personalized invitation letters ONLY for paid conference registrants of AAAI-27."
