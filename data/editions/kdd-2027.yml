note_zh: 这条只收录 Research Track 的 2 月轮（第二轮）。第一轮（官网 FAQ 叫 August Cycle）摘要 2026-07-19、正文 2026-07-26、rebuttal 2026-09-29–10-13、出结果 2026-11-14，已截止。KDD 2027 官网目前只有第一轮的征稿，2 月轮日期未公布，按 KDD 2026 第二轮官网日期顺延：摘要 2/1、正文 2/8、rebuttal 4/4–4/17、出结果 5/16、camera-ready 6/1，均为 AoE。FAQ 写明第一轮被 Reject 的稿件不能投 2 月轮（要等 KDD 2028 第一轮），只有得到 Resubmit 的稿件能以修改稿投 2 月轮；新稿件两轮都可以投。按 KDD 2027 CFP 对上一轮的同类规定类推，2 月轮被 Reject 的稿件也不能投紧接着的 KDD 2028 第一轮（见 kdd-2028）。
