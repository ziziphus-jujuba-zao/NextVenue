note_zh: ETAPS 2027 是联合会议，成员会议是 ESOP（两轮投稿）、FoSSaCS、TACAS 和新设的 iFS（由 iFM 与 FASE 合并而来），共用一份征稿。ESOP 第一轮已经结束。同一篇稿件不能同时投给多个 ETAPS 会议；录用后须有一位作者到场报告。TACAS 另有一条（TACAS 2027），日期相同。
