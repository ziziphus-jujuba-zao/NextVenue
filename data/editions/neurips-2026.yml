last_checked: 2026-09-25
note_zh: 三地举办（悉尼、亚特兰大、巴黎）。每篇论文的指定报告作者按会场意向表分配会场，10/6 17:00 UTC 公布；分配后不能再换会场或报告人。Dates 页的快照记在 data/sources/neurips-2027.yml（id neurips-2026-dates），2026-09-25 重新抓取内容相同。
