id: neurips-2026
series: neurips
name: NeurIPS 2026
year: 2026
kind: conference
data_level: curated
location: { city: Sydney / Atlanta / Paris, country: Australia / USA / France }
dates: { start: 2026-12-06, end: 2026-12-13 }
sites:
  - id: sydney
    city: Sydney
    country_code: AU
    tz: Australia/Sydney
    venue:
      name: ICC Sydney
      address: tba
      src: neurips-2026-venue
      quote: "Sydney, Australia ICC Sydney"
      note_zh: 官网没有给参会者的场馆地址。Venue Information 页写的 "Level 4, Exhibition Halls 5–7" 是展商展区，不是报告会场。
  - id: atlanta
    city: Atlanta
    country_code: US
    tz: America/New_York
    venue:
      name: Georgia World Congress Center
      address: tba
      src: neurips-2026-venue
      quote: "Atlanta, GA Georgia World Congress Center"
  - id: paris
    city: Paris
    country_code: FR
    tz: Europe/Paris
    venue:
      name: Palais des Congrès de Paris
      address: 2 Place de la Porte Maillot, Paris 17, France
      src: neurips-2026-hotels
      quote: "The main conference will take place from 9 to 11 December at the Paris Congress Center, 2 Place de la Porte Maillot, Paris 17, France"
      note_zh: Venue Information 页写作 "Palais des Congrès de Paris"，Hotels 页写作 "Paris Congress Center"，是同一处。12/12–13 的 workshop 分在两处：这里和索邦大学 Jussieu 校区（4 place Jussieu, 75005 Paris）。
milestones:
  - type: abstract
    at: 2026-05-04T23:59
    tz: AoE
    status: confirmed
    src: neurips-2026-dates
    quote: "Paper Abstract Submission Deadline May 04 '26 (Anywhere on Earth)"
  - type: paper
    at: 2026-05-06T23:59
    tz: AoE
    status: confirmed
    src: neurips-2026-dates
    quote: "Full Paper Submission Deadline May 06 '26 (Anywhere on Earth)"
  - type: reviews_out
    at: 2026-07-22
    tz: AoE
    status: confirmed
    src: neurips-2026-dates
    quote: "Reviews Released to Authors Jul 22 '26 (Anywhere on Earth)"
    note_zh: 官方只给日期、没给时刻。
  - type: discussion
    label_zh: 作者-审稿人-AC 讨论期
    start: 2026-07-27
    end: 2026-08-03
    tz: AoE
    status: confirmed
    src: neurips-2026-dates
    quote: "Author + Reviewer + AC Discussion Period Ends Aug 03 '26 (Anywhere on Earth)"
    note_zh: 开始是 "Author + Reviewer + AC Discussion Period Starts Jul 27 '26 (Anywhere on Earth)"。官方只给日期、没给时刻。
  - type: meta_reviews
    label_zh: 审稿人-AC 内部讨论
    start: 2026-08-03
    end: 2026-08-10
    tz: AoE
    status: confirmed
    src: neurips-2026-dates
    quote: "Reviewer + AC Discussion Period Ends Aug 10 '26 (Anywhere on Earth)"
  - type: notification
    at: 2026-09-24
    tz: AoE
    status: confirmed
    src: neurips-2026-dates
    quote: "Paper Author Notifications Sep 24 '26 (Anywhere on Earth)"
    note_zh: '官方只给日期、没给时刻。CFP 写 "Author notification: September 24, 2026 AoE"。'
  - type: site_preference
    at: 2026-09-30T23:59
    tz: AoE
    status: confirmed
    src: neurips-2026-dates
    quote: "Paper Presentation Site Preference Form Deadline Sep 30 '26 (Anywhere on Earth)"
    note_zh: 北京时间 10/1 周四 19:59，在国庆假期里。指定报告作者和会场意向都在这张表里改；按官方博客，分配结束后报告人和会场都不能再改（见"分配后换会场或报告人"卡）。
  - type: site_assignment
    at: 2026-10-06T17:00
    tz: UTC
    status: confirmed
    src: neurips-2026-dates
    quote: "Paper Location Assignment Notifications Oct 06 '26 05:00 PM UTC"
    note_zh: 北京时间 10/7 周三 01:00。会场满员时按随机方式分配，不保证第一志愿。
  - type: financial_aid
    label_zh: 资助（Financial Assistance）/ 志愿者申请截止
    at: 2026-10-06T23:59
    tz: AoE
    status: confirmed
    src: neurips-2026-financial-assistance
    quote: "Application deadline: 6 Oct 23:59 AoE"
    note_zh: 北京时间 10/7 周三 19:59。资助和志愿者同一天截止；志愿者这次只招悉尼和亚特兰大，结果 "by 20 Oct 23:59 AoE" 公布。截止后所填会场不能再改（"YOUR LOCATION SELECTIONS ARE FINAL AFTER THE APPLICATION DEADLINE"）。
  - type: financial_aid_result
    label_zh: 资助结果公布
    at: 2026-10-14T23:59
    tz: AoE
    status: confirmed
    src: neurips-2026-financial-assistance
    quote: "Notification: by 14 Oct 23:59 AoE"
    note_zh: 北京时间 10/15 周四 19:59 之前。官方建议不必等结果，先注册；获资助后退还注册费（见"申请资助时先注册"卡）。
  - type: registration_open
    site: sydney
    at: 2026-09-03T13:00
    tz: UTC
    status: confirmed
    src: neurips-2026-dates
    quote: "Registration Open Sep 03 '26 01:00 PM UTC"
    note_zh: 悉尼和亚特兰大在 neurips.cc 注册，同时开放（北京时间 9/3 21:00）。悉尼公众票已售罄，指定报告作者有保留名额。
  - type: registration_open
    site: atlanta
    at: 2026-09-03T13:00
    tz: UTC
    status: confirmed
    src: neurips-2026-dates
    quote: "Registration Open Sep 03 '26 01:00 PM UTC"
    note_zh: 北京时间 9/3 21:00。
  - type: registration_open
    site: paris
    label_zh: 巴黎指定报告作者开始注册
    at: 2026-10-07T00:00
    tz: Europe/Paris
    status: confirmed
    src: neurips-2026-europe-home
    quote: "Designated authors for Paris must register from 7 October to claim their reserved seat."
    note_zh: 官方只写"from 7 October"，没写时刻，这里按巴黎当天 0 点记（北京时间 10/7 周三 06:00）。巴黎公众票已售罄，指定报告作者要自己去注册才能拿到保留名额。
  - type: visa_refund_apply_by
    at: 2026-10-20
    tz: Asia/Shanghai
    tz_assumed: true
    status: confirmed
    src: neurips-2026-pricing
    quote: "you applied for your visa by Oct. 20, 2026; and"
    note_zh: 官方没写时区。递签日期按递签地记录，这里按北京时间当天算（比 AoE 早，更保守）。巴黎注册页写的是同一条件（"you applied for your visa by Oct. 20, 2026;"）。
  - type: early_registration
    site: sydney
    at: 2026-10-30T23:59
    tz: AoE
    status: confirmed
    src: neurips-2026-dates
    quote: "Early Registration Deadline Oct 30 '26 (Anywhere on Earth)"
    note_zh: 北京时间 10/31 周六 19:59。Pricing 页另写 "Early pricing ends in on 2026-10-31 22:59 pacific time"，更晚；按最早的读法取 Dates 页。悉尼和亚特兰大线下票的价格官网没有以文字公布（见 logistics.fees）。
  - type: early_registration
    site: atlanta
    at: 2026-10-30T23:59
    tz: AoE
    status: confirmed
    src: neurips-2026-dates
    quote: "Early Registration Deadline Oct 30 '26 (Anywhere on Earth)"
    note_zh: 北京时间 10/31 周六 19:59。Pricing 页另写 "Early pricing ends in on 2026-10-31 22:59 pacific time"，更晚；按最早的读法取 Dates 页。
  - type: early_registration
    site: paris
    at: 2026-10-30T23:59
    tz: Europe/Paris
    status: confirmed
    src: neurips-2026-europe-home
    quote: "Until October 30, 2026 (CET)"
    note_zh: 北京时间 10/31 周六 06:59，比悉尼和亚特兰大早 13 小时。10/31 起是标准价（"From October 31, 2026 (CET)"）。
  - type: refund_cutoff
    site: sydney
    at: 2026-11-03T23:59
    tz: AoE
    status: confirmed
    src: neurips-2026-pricing
    quote: "Registrations canceled before Nov 04, 2026 AOE will receive a full refund."
    note_zh: 北京时间 11/4 周三 19:59。Pricing 页写 "before Nov 04"，Dates 页写 "Last Chance for Registration Refund Nov 04 '26 (Anywhere on Earth)"，官方博客写 "until the deadline of Nov. 4"；按最早的读法取 11/3 23:59 AoE。之后 "Registrations cannot be canceled or refunded after this date."
  - type: refund_cutoff
    site: atlanta
    at: 2026-11-03T23:59
    tz: AoE
    status: confirmed
    src: neurips-2026-pricing
    quote: "Registrations canceled before Nov 04, 2026 AOE will receive a full refund."
    note_zh: 北京时间 11/4 周三 19:59。Dates 页写 "Last Chance for Registration Refund Nov 04 '26 (Anywhere on Earth)"；按最早的读法取 11/3 23:59 AoE。
  - type: refund_cutoff
    site: paris
    at: 2026-11-04T23:59
    tz: Europe/Paris
    status: confirmed
    src: neurips-2026-europe-home
    quote: "Registrations canceled by Nov 4, 2026 CET will receive a full refund."
    note_zh: 北京时间 11/5 周四 06:59。
  - type: visa_refund_request_by
    site: sydney
    at: 2026-12-20
    tz: Asia/Shanghai
    tz_assumed: true
    status: confirmed
    src: neurips-2026-pricing
    quote: "within one week of the close of the meeting (i.e., by Dec. 20, 2026), and include documentation showing the date you applied for a visa."
    note_zh: 官方没写时区，按北京时间当天算（更保守）。通过联系表单提交，附递签日期证明。
  - type: visa_refund_request_by
    site: atlanta
    at: 2026-12-20
    tz: Asia/Shanghai
    tz_assumed: true
    status: confirmed
    src: neurips-2026-pricing
    quote: "within one week of the close of the meeting (i.e., by Dec. 20, 2026), and include documentation showing the date you applied for a visa."
    note_zh: 官方没写时区，按北京时间当天算（更保守）。巴黎注册页有同样的转线上退差价条款，但没有写申请截止，所以巴黎没有这一项。
  - type: author_registration
    tz: AoE
    status: tba
    note_zh: 每篇论文的指定报告作者必须注册主会（见"到现场报告"卡），但注册截止日期没有公布。巴黎的指定作者 10/7 起注册；悉尼和亚特兰大的指定作者有保留名额。
  - type: camera_ready
    tz: AoE
    status: tba
    note_zh: Main Track Handbook 只写 "camera-ready papers will be due in advance of the conference"，Dates 页没有这一项。
  - type: poster
    tz: AoE
    status: tba
    note_zh: Poster Instructions 页写着 "This page has not yet been updated to 2026"；Handbook 写 poster 规格按会场另行公布。
  - type: conference
    site: sydney
    label_zh: 悉尼：Expo 12/6，Tutorial 12/7，正会 12/8–10，Workshop 12/11–12
    start: 2026-12-06
    end: 2026-12-12
    tz: Australia/Sydney
    status: confirmed
    src: neurips-2026-dates
    quote: "NeurIPS Sydney Dec 6th Expo Day Dec 7th Tutorial Day Dec 7th – 10th Exhibit Hall Open Dec 8th – 10th Main Conference Dec 11th & 12th Workshops & Competitions"
  - type: conference
    site: atlanta
    label_zh: 亚特兰大：正会和 Tutorial 12/9，正会 12/10–11，Workshop 12/12–13
    start: 2026-12-09
    end: 2026-12-13
    tz: America/New_York
    status: confirmed
    src: neurips-2026-dates
    quote: "NeurIPS Atlanta Dec 9th Main Conference + Tutorials Dec 9th – 12th Exhibit Hall Open Dec 10th & 11th Main Conference Dec 12th & 13th Workshops"
  - type: conference
    site: paris
    label_zh: 巴黎：正会和 Tutorial 12/9–11，Workshop 12/12–13
    start: 2026-12-09
    end: 2026-12-13
    tz: Europe/Paris
    status: confirmed
    src: neurips-2026-dates
    quote: "NeurIPS Paris Dec 9th - 11th Main Conference + Tutorials Dec 9th – 11th Exhibit Hall Open Dec 12th & 13th Workshops"
