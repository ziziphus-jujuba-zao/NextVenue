  coverage:
    per: author
    max_papers: null
    rate: in_person
    extra_zh: 注册主会才算，Virtual Only Pass 不算；学生作者用学生注册即可。每篇论文的指定报告作者在分配到的会场有一个保留名额。
    src: neurips-2026-handbook
    quote: "If that author is a student they only need a student registration. Finally, only one registration is needed even if the author has multiple accepted papers."
  visa_letter:
    after: paid_registration
    how_zh: 悉尼和亚特兰大：先在 neurips.cc 买线下注册，再在官网生成邀请函；去美国的递签后要回到邀请函页填签证申请号。巴黎：在巴黎注册页付费注册时一并申请。会议结束后不再出函。
    how_site_zh:
      sydney: 先在 neurips.cc 买线下注册，再在官网签证页生成邀请函。会议结束后不再出函。
      atlanta: 先在 neurips.cc 买线下注册，再在官网签证页生成邀请函；递签后回到邀请函页填签证申请号。会议结束后不再出函。
      paris: 在巴黎注册页付清注册费时一并申请邀请函。会议结束后不再出函。
    lead: tba
    url: https://neurips.cc/Conferences/2026/Visa
    src: neurips-2026-financial-assistance
    quote: "Only registered participants can receive a Visa Invitation Letter. We cannot make exceptions to this policy."
  visa_guidance:
    - country_code: AU
      weeks: [6, 8]
      src: neurips-2026-visa
      quote: "Attendees are strongly advised to apply at least 6 to 8 weeks prior to your intended date of travel."
  aid:
    - id: financial-assistance
      name: NeurIPS 2026 Financial Assistance
      covers_zh: 只补注册费和住宿（最多 7 晚）；机票、火车、市内交通、餐费都不补
      url: https://neurips.cc/Conferences/2026/FinancialAssistance
      src: neurips-2026-financial-assistance
      quote: "Financial Assistance only covers registration and accommodation fees."
    - id: volunteer
      name: NeurIPS 2026 Volunteers (Sydney, Atlanta)
      covers_zh: 先自费注册，做完两班（每班约 4 小时）后退还注册费；不含住宿。巴黎的志愿者申请之后另开
      url: https://neurips.cc/Conferences/2026/FinancialAssistance
      src: neurips-2026-financial-assistance
      quote: "The registration will be refunded after you complete your shifts."
  hotels:
    status: tba
    checked_sources: [neurips-2026-hotels]
    note_zh: 悉尼和亚特兰大的协议价只能通过官方 Housing Portal 订，巴黎由 Revolugo 代订；官网没有列出协议酒店的截止日期。
  sold_out:
    - site: sydney
      src: neurips-2026-registration
      quote: "(Sold Out): Sydney Conference & Tutorials This session is sold out."
    - site: sydney
      src: neurips-2026-registration
      quote: "(Sold Out): Sydney Workshops & Competitions This session is sold out."
    - site: paris
      src: neurips-2026-europe-home
      quote: "All registrations (conference, tutorials, workshops and competitions) are now sold out."
  poster:
    status: tba
    checked_sources: [neurips-2026-poster, neurips-2026-handbook]
    note_zh: Poster Instructions 页还没更新到 2026；Handbook 写 poster 规格按会场另行公布。
