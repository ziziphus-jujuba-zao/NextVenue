note_zh: 第 39 届 CAV，第一次在荷兰举办；2027 年不在 FLoC 内。常规论文和工具论文投稿不超过 18 页，应用/工业/案例论文不超过 10 页；常规论文双盲，工具和应用论文单盲。官网写明所有截止都是 23:59 AoE。
