  - type: early_registration
    at: 2026-07-22
    tz: Asia/Shanghai
    tz_assumed: true
    status: confirmed
    src: esmo-2026-registration
    quote: "Early registration Late registration Full registration (21% Spanish VAT included) until 22 July 2026"
    note_zh: 注册费表只写日期、没写时区，按北京时间当天结束算（更保守）。
  - type: abstract
    label_zh: 晚到摘要（LBA）截止
    at: 2026-09-08T21:00
    tz: UTC+02:00
    status: confirmed
    src: esmo-2026-abstracts
    quote: "Late-breaking abstracts 8 September 2026, 21:00 CEST"
