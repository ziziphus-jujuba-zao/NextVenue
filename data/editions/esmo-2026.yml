  - type: author_registration
    label_zh: 报告人注册截止
    at: 2026-09-30
    tz: Asia/Shanghai
    tz_assumed: true
    status: confirmed
    src: esmo-2026-abstracts
    quote: "The presenting author or the designated replacement presenter must be registered by 30 September 2026."
    note_zh: 所有录用形式（含 ePoster）都要注册；到期没注册，摘要从会议日程和摘要集里撤掉。官网没写时区，按北京时间当天结束算。
  - type: conference
    start: 2026-10-23
    end: 2026-10-27
    tz: Europe/Madrid
    status: confirmed
    src: esmo-2026-registration
    quote: "The ESMO Congress 2026 will take place from 23 to 27 October 2026 in Madrid, Spain"
