logistics:
  fees:
    - status: tba
      checked_sources: [ijcai-2027-home, ijcai-2027-future-conferences]
      note_zh: 2027 会议网站还没公开（HTTP 401）。
      reference:
        from: ijcai-2026
        currency: USD
        src: ijcai-2026-registration
        note_zh: IJCAI-ECAI 2026（不来梅）的正会注册费。IJCAI 和 EurAI 会员都算会员。按上届注册 FAQ，学生作者要让论文进论文集也得付 regular 全价（选 Student with Paper 类别）；学生价只给不挂论文的学生。上届早鸟价到 2026 年 6/15 23:59 AoE，晚注册到 7/15 23:59 AoE，之后是现场价。
        tiers:
          - { id: early }
          - { id: late }
          - { id: onsite }
        rows:
          - { id: member, label_zh: 会员（学生作者同价）, for: [student, academic, industry], member: current, covers_author: true, amounts: [980, 1150, 1250], quote: "REGULAR Early U$ 980.00 Late U$ 1,150.00 On Site U$ 1,250.00" }
          - { id: non_member, label_zh: 非会员（学生作者同价）, for: [student, academic, industry], member: none, covers_author: true, amounts: [1030, 1200, 1300], quote: "REGULAR Early U$ 1,030.00 Late U$ 1,200.00 On Site U$ 1,300.00" }
          - { id: member_student, label_zh: 会员学生（不挂论文）, for: [student], member: current, covers_author: false, amounts: [500, 550, 600], quote: "Early – Student U$ 500.00 Late – Student U$ 550.00 On Site – Student U$ 600.00" }
          - { id: non_member_student, label_zh: 非会员学生（不挂论文）, for: [student], member: none, covers_author: false, amounts: [550, 600, 650], quote: "Early – Student U$ 550.00 Late – Student U$ 600.00 On Site – Student U$ 650.00" }
  coverage:
    status: tba
    checked_sources: [ijcai-2027-home, ijcai-2027-future-conferences]
    reference:
      from: ijcai-2026
      per: author
      max_papers: null
      rate: in_person
      extra_zh: 一份 regular 注册或 Student with Paper 注册可以覆盖同一人的多篇论文；学生作者也要付 regular 全价。多位作者到场的，每人都要单独注册。注册不能转让。
      src: ijcai-2026-registration-faq
      quote: "One regular delegate registration fee OR student with paper fee covers multiple papers."
  visa_letter:
    status: tba
