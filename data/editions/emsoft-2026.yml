note_zh: EMSOFT 2026 的期刊轨道两轮审稿：通过第一轮的论文按意见在约两周内交修改稿，第二轮录用的全文发表在 IEEE TCAD。录用论文须有一位作者按全价注册并到场报告。投稿已全部截止；ESWEEK 2027 的地点和截止日期官网还没公布（近两届都是 3 月底截稿）。
