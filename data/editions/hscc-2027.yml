note_zh: 2027 年起 HSCC（第 30 届）与 ICCPS（第 18 届）合并为一个会：一个程序委员会、一套 ACM 论文集、三个 track（Foundations、Systems and Applications、AI-enabled Autonomy）。常规论文 10 页（不含参考文献），短文和工具论文 6 页（含参考文献）；常规论文和短文轻度双盲，工具论文单盲。官网写明摘要、正文、作者回复、出结果和会期已确认，其余标 Tentative 的日期（artifact 评测 2/18、海报/demo 2/11、终稿 3/30）可能调整。hscc.acm.org/2027 和 iccps.acm.org/2027 都跳转到这个官网。
