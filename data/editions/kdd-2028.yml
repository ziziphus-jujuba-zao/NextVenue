note_zh: KDD 2028 官网尚未上线。这条只收录第一轮（2027 年 7 月截止），按 KDD 2027 第一轮官网日期顺延：摘要 7/19、正文 7/26、rebuttal 9/29–10/13、出结果 11/14，均为 AoE。第二轮（约 2028 年 2 月）未收录。KDD 2027 CFP 的 Resubmission Guidelines 写明：2026 第二轮被 Reject 或看过审稿后撤稿的稿件，不能以修改稿或新稿投紧接着的 KDD 2027 第一轮；照此类推，KDD 2027 2 月轮被拒的稿件不能投这一轮，KDD 2028 的具体规定尚未公布。
