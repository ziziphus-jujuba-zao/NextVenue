note_zh: SIGGRAPH 2027 于 2027-08-08 至 12 在加州阿纳海姆举行（SIGGRAPH 2026 闭幕新闻稿）。s2027.siggraph.org 目前打不开，技术论文日期未公布；标“预计”的日期按 SIGGRAPH 2026 顺延：投稿表单 1/15、正文 1/22（UTC 22:00）、rebuttal 3/5–12、出结果 3/30、终稿 5/6。SIGGRAPH 2027 比 2026 年（7/19–23）晚约三周开会，实际截止可能稍晚。技术论文分期刊轨（ACM TOG）和会议轨，截止相同。
