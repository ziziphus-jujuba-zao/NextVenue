note_zh: 第 31 届 CADE，与 FSCD 同地举办。常规论文最长 16 页、短文（系统描述、案例等）10 页，LIPIcs 格式，不含参考文献；论文集从这一届起是 LIPIcs（开放获取）。审稿有 rebuttal 环节。投稿系统是 EasyChair（cade31，选 Main Conference track）。官网全程没写时区，所有日期按北京时间当天算。
