note_zh: 两轮投稿。Round 1 正文 6/26 截止、8/9 出审稿和初步决定（接收/修改后重投/拒稿），修改稿与 rebuttal 8/28 截止；Round 2 正文 8/28 截止，没有 rebuttal。两轮论文都在 10/9 出最终结果。截至 2026-09-25 两轮投稿都已截止，下一次可投的是 WACV 2028（预计）。
