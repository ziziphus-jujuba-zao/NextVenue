note_zh: SenSys 2027 每届两个投稿截止，每轮独立审稿。第一轮（2026 年 5–6 月）已经结束；第二轮摘要 10/29、正文 11/5（23:59 AoE），与 HSCC+ICCPS、RTAS 同在 CPS-IoT Week 2027。全文最长 12 页、短文（愿景、经验等）6 页，参考文献和附录不限页数；双盲。2026 年起 SenSys、IPSN、IoTDI 合并为这一个会。
