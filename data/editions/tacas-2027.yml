note_zh: 第 33 届 TACAS，在哥本哈根随 ETAPS 2027 举办；程序委员会主席之一是中国科学院的詹乃军。研究论文、案例论文和常规工具论文最长 18 页，工具演示论文 6 页（不含参考文献，都可加附录）；只有常规研究论文双盲。CCF 第七版没有单独列 TACAS，等级标签来自它所属的 ETAPS 条目（第 4 类 B）。
