    quote: "Paper Deadline Sep 25 '26 (Anywhere on Earth)"
  - type: reviewing
    label_zh: 审稿人写审稿（作者兼审稿人适用）
    start: 2026-10-01
    end: 2026-10-21
    tz: AoE
    status: estimated
    src: iclr-2027-reviewer-guide
    quote: "Write a constructive, thorough and timely review (September Oct 1 - Oct 21)"
    note_zh: Reviewer Guide 注明日程 "subject to minor changes"，且未写时区；CFP 的 "all times are UTC-12h" 只针对 CFP 列出的日期，审稿期不在其中，这里记为 AoE 只是沿用同一约定。原文写作 "September Oct 1 - Oct 21"，这里按 10/1–10/21 记录。
  - type: reviews_out
    at: 2026-11-05
    tz: AoE
    status: confirmed
    src: iclr-2027-dates
    quote: "Reviews Released Nov 05 '26"
    note_zh: Dates 页这一项只有日期、没写时区；CFP 写明 “all times are UTC-12h”，故记为 AoE。当天几点发布官方没写。
  - type: discussion
    label_zh: 作者-审稿人讨论期
    start: 2026-11-05
    end: 2026-11-18
    tz: AoE
    status: confirmed
    src: iclr-2027-dates
    quote: "Author- Reviewer Discussion Ends Nov 18 '26"
    note_zh: Dates 页这一项只有日期、没写时区；CFP 写明 “all times are UTC-12h”，故记为 AoE，结束时刻按当天 23:59 AoE 计。
  - type: meta_reviews
    label_zh: 审稿人-AC 内部讨论与 meta-review
    start: 2026-11-19
    end: 2026-12-16
    tz: AoE
    status: confirmed
    src: iclr-2027-dates
    quote: "Reviewer- A C Discussion and Meta-reviewing Ends Dec 16 '26"
    note_zh: Dates 页这一项只有日期、没写时区；CFP 写明 “all times are UTC-12h”，故记为 AoE，结束时刻按当天 23:59 AoE 计。
  - type: notification
    at: 2026-12-16
    tz: AoE
    status: confirmed
    src: iclr-2027-dates
    quote: "Final Decisions Dec 16 '26"
    note_zh: Dates 页这一项只有日期、没写时区；CFP 写明 “all times are UTC-12h”，故记为 AoE。当天几点发布官方没写。
  - type: camera_ready
    tz: AoE
    status: tba
    note_zh: 作者指南只写 "An email with instructions for uploading camera-ready submissions will go out mid-February 2027."，没有给截止日期。
  - type: author_registration
    tz: AoE
    status: tba
    note_zh: 作者指南要求每篇录用论文至少一位作者持 "Conference and Workshops" 注册，但没写注册截止日期；Pricing 页还是模板。
  - type: early_registration
    tz: America/Los_Angeles
    status: tba
    note_zh: 'Pricing 页写 "Early pricing ends in Date not found: EarlyRegistrationDeadline on pacific time."，还是模板占位。'
  - type: refund_cutoff
    tz: America/Los_Angeles
    status: tba
    note_zh: Pricing 页写 "Registrations canceled before The date CancellationDeadline not found."，取消截止还没填。
  - type: visa_refund_apply_by
    at: 2027-03-16
    tz: Asia/Shanghai
    status: confirmed
    src: iclr-2027-pricing
    quote: "If you applied for your visa before March 17, 2027"
    note_zh: 官方写 "before March 17"，即最晚 3/16 递签；没写时区，按北京时间当天算（更保守）。这段写在 Pricing 页，页面其余日期还是模板占位，这个日期以后可能会改。
  - type: visa_refund_request_by
    at: 2027-05-05
    tz: Asia/Shanghai
    status: estimated
    src: iclr-2027-pricing
    quote: "Refund requests must be received within one week after the close of the meeting"
    note_zh: '本应用推算（basis: assumption）。官方只写"会议结束后一周内"，没给日期：按正会 4/28 结束算是 5/5，按 workshop 4/30 结束算是 5/7，取较早的 5/5；没写时区，按北京时间当天算（更保守）。'
  - type: conference
    label_zh: 正会 4/26–28，workshop 4/29–30
    start: 2027-04-26
    end: 2027-04-30
    tz: America/Los_Angeles
    status: confirmed
    src: iclr-2027-home
    quote: "April 26-30, 2027"
    note_zh: Dates 页写正会 "April 26 - 28"、workshop "April 29 - 30"，但同页仍有 "(location and dates to be announced)" 字样。
