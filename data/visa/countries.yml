# 会场所在地（edition 的 location.country_code、sites[].country_code，或从 ccfddl 地名读出的国家，ISO 3166-1 两位字母）→ 签证文件 data/visa/<id>.yml。
# 只是路由表：要不要签证、怎么办，写在各签证文件里，每条带官方原文。
# none：中国大陆公民不需要签证（会场在中国大陆）。
# 数据里出现的每个会场国家都要在这里有一行（curated 和 ccfddl 届次都算，pnpm validate 检查）。
# 签证文件还没写的，先写将来的文件 id（例如 GB: uk）：签证卡显示"未收录"，只给会议官网的签证页链接；validate 列出这些 id 提醒补文件。
# 申根国家一律指向 schengen（validate 按申根成员名单检查），新加入的会场国家不会因为没路由而丢掉签证标签。

